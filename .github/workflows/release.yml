# 打标签 v* 后自动构建 Windows + macOS 安装包，并上传到同一 GitHub Release，供用户下载。
# 使用前请先将 package.json 里的 version 与标签一致（例如 1.2.2 对应 v1.2.2）。

name: Release (Windows + macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # GitHub 托管机无 Apple/Windows 证书；关闭自动探测，使用临时签名以便完成打包
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows (NSIS + portable)
        run: pnpm build:win

      - name: Upload Windows dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/

  build-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS (DMG + ZIP)
        run: pnpm build:mac
        env:
          # 未在仓库 Secrets 中配置时，notarize.js 会跳过公证，仍可产出可下载的 dmg/zip
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: release-assets/win

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: release-assets/mac

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            release-assets/win/**
            release-assets/mac/**
